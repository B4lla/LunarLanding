; F07 Windows x86_64 release preset. Use Godot 4.7.2 export templates.
; Optional NASA/PBR originals and JSON receipts MUST be exported explicitly
; because F05 scripts refer to their res:// paths dynamically via FileAccess.
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/nasa/*.glb,assets/nasa/*.json,assets/polyhaven/*.jpg,assets/polyhaven/*.png,assets/polyhaven/*.json,assets/audio/*.wav,assets/audio_legacy/*.wav,assets/audio_enhanced/*.wav,assets/audio_fire/*.wav,assets/procedural/*.png,assets/procedural/*.json,assets/base_materials/*.png,assets/base_materials/*.json,assets/lander_materials/*.png,assets/lander_materials/*.json,assets/terrain_materials/*.png,assets/terrain_materials/*.json"
exclude_filter="*.download,*.tmp"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
application/modify_resources=false
codesign/enable=false
